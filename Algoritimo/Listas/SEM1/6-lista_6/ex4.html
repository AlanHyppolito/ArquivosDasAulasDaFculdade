<body>
    <p>Qual o seu login?</p>
    <input type="text" id="ipt_login">
    <p>Qual a sua senha</p>
    <input type="text" id="ipt_senha">
    <p>Qual a sua informação pessoal</p>
    <input type="text" id="ipt_inf">

    <button onclick="msg()">Autenticar</button>
    <div id="div_msg"></div>
</body>

<script>
function msg(){
    let login = ipt_login.value
    let senha = ipt_senha.value
    let inf = ipt_inf.value

    if(login=='ana' && senha=='braga' && (inf== '1949' || inf=='Louro josé')){
        div_msg.innerHTML = `Usuário autenticado`
    }
    else{
        div_msg.innerHTML = `Falha na autenticação`
    }
    }

</script>
