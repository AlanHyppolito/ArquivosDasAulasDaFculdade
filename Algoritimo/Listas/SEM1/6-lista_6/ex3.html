<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p>Digite uma das opições abaixo</p>
    <p>Comum</p>
    <p>Estudante</p>
    <p>Idoso/PNE</p>
    <input type="text" id="ipt_passagem">
    <p>Digite uma das opçoes abaixo</p>
    <p>Passagem unica</p>
    <p>Passagem integração</p>
    <input type="text" id="ipt_passagem2">
    <button onclick="msg()">Simular Preço</button>

    <div id="div_msg"></div>
</body>
</html>
<script>
    function msg(){
        let passageiro = ipt_passagem.value
        let passagem = ipt_passagem2.value
        let valorTotal= 0
        if(passageiro == "Estudante" && passagem== "Unica"){
            valorTotal = 4.4*0.5
        }
        else if(passageiro== 'Estudante' && passagem== 'Passagem integração'){
            valorTotal = 5.9*0.5
        }
        else if(passageiro=="Tdoso/PNE"){
            valorTotal=0
        }

        div_msg.innerHTML = ` Valor da passagem escolhida: R$${valorTotal}.`
    }
</script>
<!-- Crie um pequeno simulador de preço de passagem de Bilhete Único de São Paulo num programa, o qual: 

a) Tenha uma combo para indicar o tipo de passageiro, com os itens 

            Comum 
            Estudante 
            Idoso/PNE 

b) Tenha uma outra combo, para indicar o tipo de passagem, com os itens 

            Passagem única 
            Passagem integração 

c) Ao clicar num botão "Simular preço", considere que o preço unitário de uma passagem única é R$4,40 e que a integração é R$5,90 para fazer os cálculos necessários para exibir uma frase como esta: 

            Valor da passagem escolhida: R$X,XX 

d) Considere ainda que um estudante tem 50% de desconto e idoso/PNE possuem gratuidade em qualquer tipo de passagem
