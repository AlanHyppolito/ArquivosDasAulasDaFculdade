<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="text" id="ipt_valor" placeholder="Qual o saldo da conta">
    <input type="text" id="ipt_debito" placeholder="Qual o valor do debito?">
    <button onclick="msg()">
        Analisar conta
    </button>
    <div id="div_msg"></div>
</body>
</html>
<script>
    function msg(){
        let valor = +ipt_valor.value
        let debito = +ipt_debito.value
        let saldo = valor - debito
        if(saldo>0){
        div_msg.innerHTML = `<span style='color:red'><b>o saldo atual da conta corrente é ${saldo}</b>  `
        }
        else{
            div_msg.innerHTML = `<span style='color:blue'><i>o saldo atual da conta corrente é ${saldo}</i>  `
        }
    }
</script>
