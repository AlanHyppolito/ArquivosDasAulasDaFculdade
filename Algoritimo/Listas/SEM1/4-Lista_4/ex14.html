<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="text" id="ipt_nome" placeholder="Qual é o seu nome?">
    <input type="text" id="ipt_idade" placeholder="Qual é a sua idade?">
    <button onclick="msg()">
        Avaliar aluno
    </button>
    <div id="div_msg"></div>
</body>
</html>
<script>
    function msg(){
        div_msg.innerHTML = ""
        let nome = ipt_nome.value
        let idade = +ipt_idade.value
        if(idade>=18){
            div_msg.innerHTML = `${nome}, vamos tirar a CNH?`
        }
        else{
            div_msg.innerHTML = `${nome}, vai jogar PlayStation!`
        }

    }
</script>
