<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <input type="text" id="ipt_dia" placeholder="Informe o dia">
    <button onclick="traduzir()">traduzir</button>
    <div id="dia"></div>
</body>

</html>
<script>
    let diasMap = {
        "monday": {
            "dia": "Segunda-feira"
        },
        "tuesday": {
            "dia": "Terça-feira"
        },
        "Wednesday": {
            "dia": "Quarta-feira"
        },
        "Thursday": {
            "dia": "Quinta-feira"
        },
        "Friday": {
            "dia": "Sexta-feira"
        },
        "Saturday": {
            "dia": "Sabado"
        },
        "Sunday": {
            "dia": "Domingo"
        }
    }

    function traduzir() {
        let day = ipt_dia.value

        dia.innerHTML = diasMap[day].dia

    }
</script>
