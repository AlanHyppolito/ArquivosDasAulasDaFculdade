<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button onclick="msg()">Gerar uma nota de aluno entre 0 e 10</button> <br>
    <div id="div_msg1"></div><br>
    <button onclick="msg2()">Gerar uma frequência de aluno entre 0 e 100</button><br>
    <div id="div_msg2"></div><br>
    <button onclick="msg3">Ver Situação</button>
</body>
</html>
<script>
    let numero = 0
    let numero2 = 0
    function msg(){
        numero = (Math.random() * 10).toFixed(2)
        div_msg1.innerHTML = numero

    }
    function msg2(){
        numero2 = (Math.random() * 100).toFixed(2)
        div_msg2.innerHTML = numero
    }
    function msg3(){
        alert(`Nota ${numero} e frequencia ${numero2}`)
    }
