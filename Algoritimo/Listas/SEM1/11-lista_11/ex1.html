<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <button onclick="numeros()">Sortear</button>
    <div id="div_msg"></div>
</body>

</html>
<script>
    function numeros() {
        let numero = Math.random()
        div_msg.innerHTML = numero.toFixed(4)

        if (numero > 0.5) {
            div_msg.innerHTML = 'Eu arredondaria para 1'
        } else {
            div_msg.innerHTML = 'Eu arredondaria para 0'
        }

    }

/*1. Crie um programa o qual:  
a) Ao clicar em um botão "Sortear", apareça na página um número aleatório, entre 0 e 0.9999;  

b) Se esse número for maior que 0.5, exibir, abaixo, a frase "Eu arredondaria para 1".  Caso contrário, exiba "Eu arredondaria para 0". */
</script>
