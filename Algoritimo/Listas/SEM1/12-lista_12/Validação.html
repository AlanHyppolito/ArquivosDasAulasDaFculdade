<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h2>Soma</h2>
    <input type="text" id="ipt_numero1" placeholder="Numero">
    <input type="text" id="ipt_numero2" placeholder="Numero">
    <button onclick="soma()">somar</button><br>
    <div id="div_soma"></div>


    <h2>Distancia</h2>
    <input type="text" id="ipt_x1" placeholder="Informe o x1">
    <input type="text" id="ipt_y1" placeholder="Informe o y1"><br>
    <input type="text" id="ipt_x2" placeholder="Informe o x2">
    <input type="text" id="ipt_y2" placeholder="Informe o y2"><br>
    <button onclick="distancia()">Calcular distancia</button><br>
    <div id="div_distancia"></div>
    <h2>Converter segundos para Hr:Min:Seg</h2>
    <input type="text" id="ipt_seg" placeholder="Numero">
    <button onclick="converter()">Converter</button><br>
    <div id="div_converter"></div>
    <h2>Numero primo</h2>
    <input type="text" id="ipt_numero_primo" placeholder="Numero">
    <button onclick="primo()">É primo?</button>
    <div id="div_primo"placeholder="Numero"></div>
    <h2>Fatorial</h2>
    <input type="text" id="ipt_fatorial" placeholder="Numero">
    <button onclick="fatorial()">É fatorial?</button>
    <div id="div_fatorial"></div>
    <h2>Media</h2>
    <input type="text" id="ipt_media" placeholder="Numero">
    <button onclick="media()">Calcular media</button>
    <div id="div_media"></div>
    <h2>Media ponderada</h2>
    <input type="text" id="ipt_media_ponderada" placeholder="Numero">
    <input type="text" id="ipt_peso" placeholder="Peso">
    <button onclick="mediaPonderada()">Calcular media</button>
    <div id="div_mediaPonderada"></div>



</body>

</html>
<script>
    function soma() {
        let numero1 = Number(ipt_numero1.value);
        let numero2 = Number(ipt_numero2.value);
        let retorno = somar(numero1, numero2);
        div_soma.innerHTML = retorno
    }
    function distancia() {
        let x1 = Number(ipt_x1.value)
        let y1 = Number(ipt_y1.value)
        let x2 = Number(ipt_x2.value)
        let y2 = Number(ipt_y2.value)

        let retorno = calcularDistancia(x1, y1, x2, y2)
        div_distancia.innerHTML = retorno
    }
    function converter() {
        let numero = Number(ipt_seg.value)

        let retorno = converterParaHoraMinutoSegundo(numero)
        div_converter.innerHTML = retorno
    }
    function primo(){
        let numero = Number
        (ipt_numero_primo.value)
        let Primo = ePrimo(numero)
        if(Primo == true){
            div_primo.innerHTML = `O numero ${numero} é primo!`
        }
        if(Primo == false){
             div_primo.innerHTML = `O numero ${numero} não é primo!`
        }
    }
    function fatorial(){
        let numero = Number(ipt_fatorial.value)

        let retorno = calcularFatorial(numero)
        div_fatorial.innerHTML = retorno
    }
    let vetor = []
    function media(){
        let numero = Number(ipt_media.value)
        vetor.push(numero)

        let retorno = calcularMedia(vetor)
        div_media.innerHTML = retorno
    }
    let vetorMedias = []
    let vetorPesos = []
    function mediaPonderada(){
        let numero = Number(ipt_media_ponderada.value)
        vetorMedias.push(numero)
        let peso = Number(ipt_peso.value)
        vetorPesos.push(peso)

        let retorno = calcularMediaPonderada(vetorMedias, vetorPesos)
        div_mediaPonderada.innerHTML = retorno
    }
</script>
