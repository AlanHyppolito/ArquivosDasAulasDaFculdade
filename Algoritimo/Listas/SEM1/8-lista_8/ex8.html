<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    Informe um numero: <br>
    <input type="text" id="ipt_numero"> <br>
    Diga um frase : <br>
    <input type="text" id="ipt_frase"> <br><br>
    <button onclick="msg()">Papagaio</button> <br>
</body>
</html>
<script>
function msg(){
let numero = ipt_numero.value
let frase = ipt_frase.value
let contador = 1
while(contador <= numero){
    alert = (`${numero} ${frase}`)
contador++
}
}
</script>
