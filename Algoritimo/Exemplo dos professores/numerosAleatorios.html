<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button onclick="exibir()">Exibir numero aleatorio</button>
    <div id="div_msg"></div>
</body>
</html>
<script>
    function exibir(){
        // ele geranueros entre 10 e 20 -> Math.random() * (maximo -minim) + minimo;
        let numero = Math.random() * 10; 
        // só gera numeros entre 0 e 1, sendo que 1 nao esta incluido
        div_msg.innerHTML = `${numero.toFixed(0)}`
    }
</script>
