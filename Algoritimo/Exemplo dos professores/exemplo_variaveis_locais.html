<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <span>nota1 </span>
    <input type="text" id="ipt_nota1">
    <span>Nota 2:</span>
    <input type="text" id="ipt_nota2">
    <br>
    <button onclick="calcularMedia()">Calcular Media</button>
    <div id="div_mensagem"></div>
    <button onclick="exex"> Exibir Resultado</button>
</body>
</html>
<script>
    /* variavel*/
    let nota1 = Number(ipt_nota1.value);
    let nota2 = Number(ipt_nota2.value);
    let media=0

    function calcularMedia(){
        
        media = (nota1+nota2)/2;
        div_mensagem.innerHTML = "A média é:" + ((nota1+nota2)/2)

        alert ("A média é: " + media)
    }
    function exeb(){
        alert("A media é:" + media)
        media = (nota1+nota2)/2;
    }
</script>
