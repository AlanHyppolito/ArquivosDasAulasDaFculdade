<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="text" id="ipt_qtdFilhos" placeholder="informe a quantidade de filhos">
    <button onclick="msg()">Analisar familia</button>
    <div id="div_msg"></div>
</body>
</html>
<script>
    function msg(){
        let qtd = +ipt_qtdFilhos.value
        div_msg.innerHTML = ""

    if (qtd<=0){
        div_msg.innerHTML = ""
    }
    if (qtd==1){
        div_msg.innerHTML += "Não tem TV"
    }
    if (qtd==2){
        div_msg.innerHTML += "<br> Não tem internet"
    }
    if (qtd==3){
        div_msg.innerHTML += "<br> Não tem video game"
    }
    if (qtd==4){
        div_msg.innerHTML += "<br> Não tem Netflix"
    }
    if (qtd>4){
        div_msg.innerHTML = "Não tem TV <br> Não tem internet <br> Não tem video game <br> Não tem Netflix"
    }
    }
</script>
