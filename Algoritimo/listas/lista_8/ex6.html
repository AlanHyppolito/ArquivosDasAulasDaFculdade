<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    diga um numero entre 20 e 100
    <input type="text" id="ipt_numero">
<br>
    <button onclick="msg()">Adoro multiplos de 5</button>
    <br>
    <div id="div_msg"></div>
</body>
</html>
<script>
function msg(){
let numero = +ipt_numero.value
let contador = 5
while(contador <= numero){
div_msg.innerHTML += `${contador}<br>`
contador += 5 
}
}

</script>
