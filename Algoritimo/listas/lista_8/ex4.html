<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>
    <button onclick="msg()">S2 Pares</button>
    <div id="div_msg"></div>
</body>

<script>
function msg(){
let numero = 0
while(numero <= 100){
div_msg.innerHTML += `${numero}<br>`

}
}
</script>
