<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <input type="text" id="ipt_elemento"><br>
    <button onclick="addVetor()">Adicionar elemento</button><br>
    <button onclick="exibirDuplicados()">Exibir Duplicados</button><br>
    <button onclick="delDuplicadas()">Remover Duplicatas</button>

    <div id="div_msg"></div>
</body>

</html>
<script>
    let vetor = []
    function addVetor() {
        div_msg.innerHTML = ""
        let elemento = ipt_elemento.value
        vetor.push(elemento)
        for (let i = 0; i < vetor.length; i++) {
            div_msg.innerHTML += vetor[i]+ '<br>'
        }
        ipt_elemento.value = ""
    }
    function delDuplicadas(){
        div_msg.innerHTML = ""
        for (i = 0; i <vetor.length; i++){
            for(a = 0; a <vetor.length; a++){
                if(vetor[i] == vetor[a]) {
                vetor.splice(a)}
        }}
            div_msg.innerHTML = vetor
        
    }
    function exibirDuplicados(){
        div_msg.innerHTML = ""
        for (i = 0; i <vetor.length; i++){
            for(a = 0; a <vetor.length; a++){
                if(vetor[i] == vetor[a]){
                    div_msg.innerHTML += vetor[i]+ '<br>'
                }
                
        }}}
</script>
